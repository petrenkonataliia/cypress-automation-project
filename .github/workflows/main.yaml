name: Run E2E Tests in Docker

on:
  push:
    branches: [ main, homework-22.1 ]
  pull_request:

jobs:
  cypress-tests:
    name: Cypress Tests (Docker)
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.9.0-chrome-118.0.5993.88-1-ff-118.0.2-edge-118.0.2088.46-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies and Cypress binary
        run: |
          npm ci
          npx cypress install

      - name: Run Cypress tests
        run: npx cypress run --browser chrome --config-file config/qauto.config.js

  playwright-tests:
    name: Playwright Tests (Docker)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test